name: Check parcels

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC
  workflow_dispatch:
    inputs:
      parcels:
        description: GeoJSON file of parcels
        default: parcels/demo.geojson
      baseline:
        description: "Optional baseline window, YYYY-MM-DD:YYYY-MM-DD"
        required: false
      recent:
        description: "Optional recent window, YYYY-MM-DD:YYYY-MM-DD"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

      - name: Run change detection
        env:
          PARCELS: ${{ inputs.parcels || 'parcels/demo.geojson' }}
          BASELINE: ${{ inputs.baseline }}
          RECENT: ${{ inputs.recent }}
        run: |
          args=("$PARCELS" --out out)
          [ -n "$BASELINE" ] && args+=(--baseline "$BASELINE")
          [ -n "$RECENT" ] && args+=(--recent "$RECENT")
          python -m parcelwatch.run "${args[@]}"
          python -m parcelwatch.summary out/alerts.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: parcel-report
          path: out/

      - name: Open an issue for new alerts
        if: vars.OPEN_ISSUES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -m parcelwatch.summary out/alerts.json --alerts-only > alert.md; then
            echo "No alerts."
          else
            gh issue create --title "Parcel alerts $(date -u +%F)" --body-file alert.md \
              --label parcel-alert 2>/dev/null \
              || gh issue create --title "Parcel alerts $(date -u +%F)" --body-file alert.md
          fi
